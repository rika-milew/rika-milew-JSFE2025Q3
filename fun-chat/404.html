<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const repoBase = '/rika-milew-JSFE2025Q3/fun-chat/';
    let path = window.location.pathname;
    if (path.startsWith(repoBase)) {
      path = path.slice(repoBase.length);
    }
    const validRoutes = ['login', 'main', 'about'];
    const route = validRoutes.includes(path) ? path : 'login';
    window.location.replace(repoBase + '#' + route);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
