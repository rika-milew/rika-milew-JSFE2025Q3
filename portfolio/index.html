<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <meta name="description" content="Professional photographer">
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon" sizes="32x32">
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <div class="logo">
                <img src="assets/icons/icon.svg" alt="">
            </div>
            <nav class="menu">
                <button class="menu__burger">
                    <span></span>
                    <span></span>
                </button>
                 <ul class="menu__list">
                    <li><a href="#about-me" target="_blank" class="menu__link base">About me</a></li>
                    <li><a href="#portfolio" class="menu__link base">Portfolio</a></li>
                    <li><a href="#price" class="menu__link base">Price</a></li>
                    <li><a href="#faq" class="menu__link base">Faq</a></li>
                    <li><a href="#contacts" class="menu__link base">Contacts</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="hero" class="hero">
            <div class="container hero__container hero">
                    <div class="hero__decoration">
                        <div class="hero__signature small">Best Photographer by MAX</div>
                        <div class="hero__line"></div>
                        <div class="hero__year small">2025</div>
                    </div>
                    <div class="hero__heading">
                        <div class="hero__info">
                            <div class="hero__statistics">
                                <div class="hero__plus decoration">+</div>
                                <div  class="hero__more">
                                    <div class="hero__numbers decoration">487</div>
                                    <div class="hero__facts base">Photo sessions</div>
                                </div>
                            </div>
                            <div class="hero__statistics">
                                <div class="hero__plus decoration">+</div>
                                <div  class="hero__more">
                                    <div class="hero__numbers decoration">356</div>
                                    <div class="hero__facts base">Satisfied clients</div>
                                </div>
                            </div>
                        </div>
                        <h1 class="hero__header h1">Professional photographer</h1>
                        <h3 class="hero__capture h3">Capture the Moment. Tell Your Story.</h3>
                        <div class="hero__scroll base">
                            <div class="hero__scroll-text">Scroll down</div>
                            <div>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 5V19" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M19 12L12 19L5 12" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="hero__image-block">
                        <div class="hero__image"></div>
                    </div>
                    <div class="hero__text">
                        <div class="hero__image2"></div>
                        <div class="hero__text2 base">Hi! I’m Vera, a photographer. For me, photography is more than just an image. </div>
                    </div>

                </div>
            </div>
        </section>
    </main>
    <footer></footer>
    <script src="js/main.js"></script>
</body>
</html>
